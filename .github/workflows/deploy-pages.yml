name: Publicar STAGIO 360 no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: stagio-360-pages
  cancel-in-progress: false

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar portal
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar indicadores e arquivos
        run: python scripts/audit_site.py
      - name: Empacotar apenas o site público
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R assets admin fundamental-1 _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/admin/governanca.html
          test -s _site/fundamental-1/index.html
          test -s _site/assets/stagio360-logo-oficial.svg
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publicar arquivos estáticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Implantar portal
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirmar acessibilidade do site publicado
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -e
          BASE="${SITE_URL%/}"
          curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors "${BASE}/" -o /tmp/stagio360-home.html
          grep -qi "STAGIO 360" /tmp/stagio360-home.html
          curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors "${BASE}/admin/governanca.html" -o /tmp/stagio360-governanca.html
          grep -qi "Gestão por etapa" /tmp/stagio360-governanca.html
          curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors "${BASE}/fundamental-1/" -o /tmp/stagio360-f1.html
          test -s /tmp/stagio360-f1.html
          echo "Site publicado e rotas principais acessíveis."
