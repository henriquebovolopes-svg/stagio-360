name: Publicar STAGIO 360 no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: stagio-360-pages
  cancel-in-progress: false

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar portal
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar indicadores e arquivos
        run: python scripts/audit_site.py
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publicar arquivos estáticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Implantar portal
        id: deployment
        uses: actions/deploy-pages@v4
