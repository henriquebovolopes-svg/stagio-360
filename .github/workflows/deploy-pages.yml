name: Publicar STAGIO 360 no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: stagio-360-pages
  cancel-in-progress: false

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar portal
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar indicadores e arquivos
        run: python scripts/audit_site.py
      - name: Auditar consistência visual v11 em 19 páginas
        run: python scripts/audit_visual_v9.py
      - name: Validar JavaScript visual v9
        run: node --check assets/stagio360-visual-v10.js
      - name: Auditar listas de professores do ciclo M1/2026
        run: node scripts/audit_teacher_dropdowns_2026.mjs
      - name: Empacotar apenas o site público
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp painel.html _site/painel.html
          cp -R assets admin fundamental-1 _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/painel.html
          test -s _site/assets/stagio360-nps-publico-2023-2026.json
          test -s _site/admin/minha-area.html
          test -s _site/admin/segmento.html
          test -s _site/admin/governanca.html
          test -s _site/admin/integracao.html
          test -s _site/admin/coord-fii-em.html
          test -s _site/admin/pesquisas-2026.html
          test -s _site/admin/academico.html
          test -s _site/admin/planejamento.html
          test -s _site/admin/infantil.html
          test -s _site/admin/config.js
          test -s _site/fundamental-1/index.html
          test -s _site/assets/stagio360-logo-oficial.svg
          test -s _site/assets/stagio360-unified.css
          test -s _site/assets/stagio360-visual-v9.css
          test -s _site/assets/stagio360-visual-v9.js
          test -s _site/assets/stagio360-pastel-v10.css
          test -s _site/assets/stagio360-white-panels-v11.css
          test -s _site/assets/stagio360-visual-v10.js
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publicar arquivos estáticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Implantar portal
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirmar acessibilidade do site publicado
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -e
          BASE="${SITE_URL%/}"
          curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors "${BASE}/" -o /tmp/stagio360-home.html
          grep -qi "STAGIO 360" /tmp/stagio360-home.html
          curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors "${BASE}/painel.html" -o /tmp/stagio360-painel.html
          grep -q "Indicadores gerais da escola" /tmp/stagio360-painel.html
          curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors "${BASE}/assets/stagio360-nps-publico-2023-2026.json" -o /tmp/stagio360-publico-nps.json
          python3 -c 'import json; d=json.load(open("/tmp/stagio360-publico-nps.json")); assert len(d["rows"])>=25; assert all("respondent_code" not in r and "email" not in r for r in d["rows"])'
          curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors "${BASE}/admin/minha-area.html" -o /tmp/stagio360-minha-area.html
          grep -q 'id="stage-cards"' /tmp/stagio360-minha-area.html
          grep -q "stg_scope_access" /tmp/stagio360-minha-area.html
          curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors "${BASE}/admin/governanca.html" -o /tmp/stagio360-governanca.html
          grep -qi "Gestão por etapa" /tmp/stagio360-governanca.html
          curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors "${BASE}/admin/segmento.html?etapa=fundamental1&aba=pesquisas" -o /tmp/stagio360-segmento.html
          grep -q "Navegação da Avaliação 360" /tmp/stagio360-segmento.html
          grep -q 'id="tab-pdis"' /tmp/stagio360-segmento.html
          curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors "${BASE}/admin/integracao.html" -o /tmp/stagio360-integracao.html
          grep -q "stg_360_integrate_autoeval" /tmp/stagio360-integracao.html
          grep -q "stg_360_autoeval_reconciliation" /tmp/stagio360-integracao.html
          curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors "${BASE}/admin/planejamento.html" -o /tmp/stagio360-planejamento.html
          grep -q "stg_planning_entries" /tmp/stagio360-planejamento.html
          curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors "${BASE}/admin/infantil.html" -o /tmp/stagio360-infantil.html
          grep -q "stg_infantil_indicators" /tmp/stagio360-infantil.html
          curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors "${BASE}/admin/config.js" -o /tmp/stagio360-auth-config.js
          grep -q "STAGIO_AUTH" /tmp/stagio360-auth-config.js
          curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors "${BASE}/fundamental-1/" -o /tmp/stagio360-f1.html
          test -s /tmp/stagio360-f1.html
          curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors "${BASE}/assets/stagio360-unified.css" -o /tmp/stagio360-theme-v8.css
          grep -q -- "--s360ui-blue" /tmp/stagio360-theme-v8.css
          grep -q 'stagio360-unified.css?v=8' /tmp/stagio360-home.html
          grep -q 'stagio360-unified.css?v=8' /tmp/stagio360-minha-area.html
          grep -q 's360-quick-nav' /tmp/stagio360-planejamento.html
          curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors "${BASE}/assets/stagio360-visual-v9.css" -o /tmp/stagio360-visual-v9.css
          curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors "${BASE}/assets/stagio360-visual-v9.js" -o /tmp/stagio360-visual-v9.js
          grep -q -- "--s360-v9-blue" /tmp/stagio360-visual-v9.css
          grep -q -- "buildInsights()" /tmp/stagio360-visual-v9.js
          grep -q 'id="s360-v9-insights"' /tmp/stagio360-home.html
          grep -q 'id="s360-v9-insights"' /tmp/stagio360-painel.html
          grep -q 'stagio360-visual-v9.css?v=9' /tmp/stagio360-home.html
          grep -q 'stagio360-pastel-v10.css?v=10' /tmp/stagio360-home.html
          grep -q 'stagio360-visual-v10.js?v=10' /tmp/stagio360-minha-area.html
          curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors "${BASE}/assets/stagio360-pastel-v10.css" -o /tmp/stagio360-pastel-v10.css
          curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors "${BASE}/assets/stagio360-visual-v10.js" -o /tmp/stagio360-visual-v10.js
          grep -q -- "--s360-pastel-blue" /tmp/stagio360-pastel-v10.css
          curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors "${BASE}/assets/stagio360-white-panels-v11.css" -o /tmp/stagio360-white-panels-v11.css
          grep -q -- "--s360-v11-panel" /tmp/stagio360-white-panels-v11.css
          grep -q -- "#avaliacao > .card.kpi:nth-child(4)" /tmp/stagio360-white-panels-v11.css
          grep -q 'Colaboradores · Privado' /tmp/stagio360-visual-v10.js
          grep -q 'id="nps-institucional"' /tmp/stagio360-home.html
          grep -q 'id="nps-institucional"' /tmp/stagio360-painel.html
          # Passo 9: conferência HTTP da totalidade das 19 páginas publicadas,
          # não apenas dos pontos de entrada. Não requer nem expõe credenciais.
          for route in \
            index.html painel.html fundamental-1/ \
            admin/index.html admin/minha-area.html admin/segmento.html \
            admin/infantil.html admin/planejamento.html admin/governanca.html \
            admin/integracao.html admin/coord-fii-em.html admin/pesquisas-2026.html admin/academico.html admin/funcionarios.html admin/sintese.html \
            admin/pdi.html admin/revisao.html admin/import.html admin/reset.html; do
            curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors "${BASE}/${route}" -o /tmp/stagio360-checked-route.html
            grep -qi "STAGIO 360" /tmp/stagio360-checked-route.html
            grep -q 's360-harmonized' /tmp/stagio360-checked-route.html
            grep -q 'stagio360-unified.css?v=8' /tmp/stagio360-checked-route.html
            grep -q 'stagio360-visual-v9.css?v=9' /tmp/stagio360-checked-route.html
            grep -q 'stagio360-pastel-v10.css?v=10' /tmp/stagio360-checked-route.html
            grep -q 'stagio360-white-panels-v11.css?v=11' /tmp/stagio360-checked-route.html
            grep -q 'stagio360-visual-v10.js?v=10' /tmp/stagio360-checked-route.html
            grep -q 's360-v9' /tmp/stagio360-checked-route.html
            echo "Rota validada: ${route}"
          done
          echo "Site publicado e 19 rotas com KPIs pastéis e painéis brancos v11 acessíveis."
