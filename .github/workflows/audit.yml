name: Auditoria STAGIO 360
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Auditar arquivos e indicadores
        run: python scripts/audit_site.py
      - name: Auditar KPIs pastéis e painéis brancos v11 em 19 páginas
        run: python scripts/audit_visual_v9.py
      - name: Validar JavaScript visual v9
        run: node --check assets/stagio360-visual-v10.js
      - name: Verificar sintaxe dos scripts inline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          for path in [Path('index.html'), Path('painel.html'), Path('fundamental-1/index.html'), *Path('admin').glob('*.html')]:
              content=path.read_text(encoding='utf-8')
              for i, match in enumerate(re.finditer(r'<script([^>]*)>([\\s\\S]*?)</script>',content,re.I)):
                  attrs,code=match.group(1),match.group(2)
                  if not code.strip():
                      continue
                  is_module='type="module"' in attrs or "type='module'" in attrs
                  args=['node','--input-type=module' if is_module else '--input-type=commonjs','--check','-']
                  result=subprocess.run(args, input=code, text=True, capture_output=True)
                  if result.returncode:
                      raise SystemExit(f'{path} bloco {i}: {result.stderr}')
          print('JavaScript: sintaxe validada')
          PY
